[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fauxnance-api"
version = "0.1.0"
description = "A serverless educational market-data API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aws-lambda-powertools>=3,<4",
]

[project.optional-dependencies]
dev = [
  "boto3>=1.35,<2",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*", "cli*"]

