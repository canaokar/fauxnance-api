service: fauxnance-api
frameworkVersion: "4"
configValidationMode: error

custom:
  dataTableName: fauxnance-${sls:stage}-data
  controlTableName: fauxnance-${sls:stage}-control
  awsAccountId: ${aws:accountId}
  adminKeyIdsParameter: /fauxnance/${sls:stage}/admin/key_ids
  alphaVantageApiKeyParameter: /fauxnance/${sls:stage}/upstreams/alpha_vantage/api_key
  coinGeckoApiKeyParameter: /fauxnance/${sls:stage}/upstreams/coingecko/api_key
  finnhubApiKeyParameter: /fauxnance/${sls:stage}/upstreams/finnhub/api_key
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    strip: false

provider:
  name: aws
  runtime: python3.13
  architecture: arm64
  stage: ${opt:stage, "dev"}
  region: ${opt:region, "eu-west-2"}
  profile: ${opt:aws-profile, "megh.io"}
  deploymentMethod: direct
  logRetentionInDays: 14
  versionFunctions: false
  environment:
    STAGE: ${sls:stage}
    LOG_LEVEL: INFO
    POWERTOOLS_SERVICE_NAME: fauxnance-api
  tags:
    project: fauxnance
    env: ${sls:stage}
    managed-by: serverless
  stackTags:
    project: fauxnance
    env: ${sls:stage}
    managed-by: serverless
  logs:
    httpApi: true
  httpApi:
    name: ${self:service}-${sls:stage}
    payload: "2.0"
    cors:
      allowedOrigins:
        - "*"
      allowedHeaders:
        - Content-Type
        - X-Api-Key
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: false
      exposedResponseHeaders:
        - Retry-After
    authorizers:
      apiKeyAuthorizer:
        type: request
        functionName: authorizer
        payloadVersion: "2.0"
        enableSimpleResponses: true
        identitySource:
          - $request.header.X-Api-Key
        resultTtlInSeconds: 300

package:
  individually: true
  patterns:
    - "!**"

functions:
  api:
    handler: src.api.handler.handler
    description: Fauxnance Phase 1 public API
    memorySize: 512
    timeout: 15
    environment:
      DATA_TABLE: ${self:custom.dataTableName}
      CONTROL_TABLE: ${self:custom.controlTableName}
      DEFAULT_DAILY_QUOTA: "2000"
      HEALTH_MARKETS: US,IN,FX,CRYPTO
      FINNHUB_API_KEY_PARAMETER: ${self:custom.finnhubApiKeyParameter}
      COINGECKO_API_KEY_PARAMETER: ${self:custom.coinGeckoApiKeyParameter}
      INGEST_QUEUE_URL:
        Ref: IngestQueue
    package:
      patterns:
        - src/__init__.py
        - src/api/**
        - src/adapters/**
        - src/synthetic/**
        - src/shared/**
        - docs/openapi.yaml
    iamRoleStatementsName: ${self:service}-${sls:stage}-api-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:BatchGetItem
          - dynamodb:Query
          - dynamodb:PutItem
          - dynamodb:TransactWriteItems
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.dataTableName}
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - arn:${aws:partition}:ssm:${aws:region}:${self:custom.awsAccountId}:parameter/fauxnance/${sls:stage}/upstreams/finnhub/api_key
          - arn:${aws:partition}:ssm:${aws:region}:${self:custom.awsAccountId}:parameter/fauxnance/${sls:stage}/upstreams/coingecko/api_key
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt:
              - IngestQueue
              - Arn
    events:
      - httpApi:
          method: GET
          path: /v1/health
      - httpApi:
          method: GET
          path: /v1/docs
      - httpApi:
          method: GET
          path: /v1/openapi.yaml
      - httpApi:
          method: GET
          path: /v1/usage
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/symbols/{symbol}
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/candles/{symbol}
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/quotes
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/quotes/{symbol}
          authorizer:
            name: apiKeyAuthorizer

  admin:
    handler: src.admin.handler.handler
    description: Manages Fauxnance cohorts, student keys, symbols, and backfills
    memorySize: 512
    timeout: 15
    environment:
      CONTROL_TABLE: ${self:custom.controlTableName}
      DATA_TABLE: ${self:custom.dataTableName}
      BACKFILL_COORDINATOR_FUNCTION:
        Ref: BackfillCoordinatorLambdaFunction
    package:
      patterns:
        - src/__init__.py
        - src/admin/**
        - src/ingest/**
        - src/shared/**
    iamRoleStatementsName: ${self:service}-${sls:stage}-admin-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:BatchGetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:TransactWriteItems
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.dataTableName}
      - Effect: Allow
        Action:
          - lambda:InvokeFunction
        Resource:
          - Fn::GetAtt:
              - BackfillCoordinatorLambdaFunction
              - Arn
    events:
      - httpApi:
          method: POST
          path: /v1/admin/cohorts
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/admin/cohorts
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/admin/cohorts/{cohortId}
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: PATCH
          path: /v1/admin/cohorts/{cohortId}
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: POST
          path: /v1/admin/keys
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/admin/keys
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: DELETE
          path: /v1/admin/keys/{keyId}
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: POST
          path: /v1/admin/symbols
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: POST
          path: /v1/admin/ingest/backfill
          authorizer:
            name: apiKeyAuthorizer
      - httpApi:
          method: GET
          path: /v1/admin/ingest/jobs/{jobId}
          authorizer:
            name: apiKeyAuthorizer

  console:
    handler: src.console.handler.handler
    description: Instructor console login, session, and class administration API
    memorySize: 512
    timeout: 15
    environment:
      CONTROL_TABLE: ${self:custom.controlTableName}
    package:
      patterns:
        - src/__init__.py
        - src/console/**
        - src/admin/**
        - src/shared/**
    iamRoleStatementsName: ${self:service}-${sls:stage}-console-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:BatchGetItem
          - dynamodb:Query
          - dynamodb:Scan
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:TransactWriteItems
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
    events:
      - httpApi:
          method: POST
          path: /v1/console/login
      - httpApi:
          method: POST
          path: /v1/console/logout
      - httpApi:
          method: GET
          path: /v1/console/me
      - httpApi:
          method: GET
          path: /v1/console/users
      - httpApi:
          method: POST
          path: /v1/console/users
      - httpApi:
          method: PATCH
          path: /v1/console/users/{userId}
      - httpApi:
          method: GET
          path: /v1/console/classes
      - httpApi:
          method: POST
          path: /v1/console/classes
      - httpApi:
          method: GET
          path: /v1/console/classes/{cohortId}
      - httpApi:
          method: POST
          path: /v1/console/classes/{cohortId}/instructors
      - httpApi:
          method: DELETE
          path: /v1/console/classes/{cohortId}/instructors/{userId}
      - httpApi:
          method: POST
          path: /v1/console/classes/{cohortId}/students
      - httpApi:
          method: DELETE
          path: /v1/console/classes/{cohortId}/students/{keyId}

  backfillCoordinator:
    handler: src.admin.coordinator.handler
    description: Expands administrative backfill jobs into symbol-year work
    memorySize: 512
    timeout: 900
    reservedConcurrency: 1
    environment:
      DATA_TABLE: ${self:custom.dataTableName}
      CONTROL_TABLE: ${self:custom.controlTableName}
      INGEST_QUEUE_URL:
        Ref: IngestQueue
    package:
      patterns:
        - src/__init__.py
        - src/admin/**
        - src/ingest/**
        - src/shared/**
        - data/universes/*.json
    iamRoleStatementsName: ${self:service}-${sls:stage}-backfill-coordinator-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.dataTableName}
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:DeleteItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:Query
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt:
              - IngestQueue
              - Arn
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true
          input:
            action: sweep

  authorizer:
    handler: src.authorizer.handler.handler
    description: Validates Fauxnance API keys and attaches quota context
    memorySize: 256
    timeout: 5
    environment:
      CONTROL_TABLE: ${self:custom.controlTableName}
      ADMIN_KEY_IDS_PARAMETER: ${self:custom.adminKeyIdsParameter}
    package:
      patterns:
        - src/__init__.py
        - src/authorizer/**
        - src/shared/**
    iamRoleStatementsName: ${self:service}-${sls:stage}-authorizer-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - arn:${aws:partition}:ssm:${aws:region}:${self:custom.awsAccountId}:parameter/fauxnance/${sls:stage}/admin/key_ids

  dispatcher:
    handler: src.ingest.dispatcher.handler
    description: Enqueues the nightly US end-of-day ingest work
    memorySize: 256
    timeout: 60
    environment:
      DATA_TABLE: ${self:custom.dataTableName}
      INGEST_QUEUE_URL:
        Ref: IngestQueue
    package:
      patterns:
        - src/__init__.py
        - src/ingest/**
        - src/shared/**
    iamRoleStatementsName: ${self:service}-${sls:stage}-dispatcher-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.dataTableName}
      - Effect: Allow
        Action:
          - sqs:SendMessage
        Resource:
          - Fn::GetAtt:
              - IngestQueue
              - Arn
    events:
      - schedule:
          rate: cron(30 23 ? * MON-FRI *)
          enabled: true
          input:
            market: US
      - schedule:
          rate: cron(30 13 ? * MON-FRI *)
          enabled: true
          input:
            market: IN
      - schedule:
          rate: cron(0 18 ? * MON-FRI *)
          enabled: true
          input:
            market: FX
      - schedule:
          rate: cron(30 1 * * ? *)
          enabled: true
          input:
            market: CRYPTO

  ingestWorker:
    handler: src.ingest.handler.handler
    description: Fetches and stores queued end-of-day market data
    memorySize: 512
    timeout: 60
    reservedConcurrency: 2
    environment:
      DATA_TABLE: ${self:custom.dataTableName}
      CONTROL_TABLE: ${self:custom.controlTableName}
      ALPHA_VANTAGE_API_KEY_PARAMETER: ${self:custom.alphaVantageApiKeyParameter}
      COINGECKO_API_KEY_PARAMETER: ${self:custom.coinGeckoApiKeyParameter}
      MAX_PROCESSING_RECEIVES: "5"
    package:
      patterns:
        - src/__init__.py
        - src/ingest/**
        - src/adapters/**
        - src/shared/**
    iamRoleStatementsName: ${self:service}-${sls:stage}-ingest-worker-role
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.dataTableName}
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:UpdateItem
          - dynamodb:TransactWriteItems
        Resource:
          - arn:${aws:partition}:dynamodb:${aws:region}:${self:custom.awsAccountId}:table/${self:custom.controlTableName}
      - Effect: Allow
        Action:
          - ssm:GetParameter
        Resource:
          - arn:${aws:partition}:ssm:${aws:region}:${self:custom.awsAccountId}:parameter/fauxnance/${sls:stage}/upstreams/alpha_vantage/api_key
          - arn:${aws:partition}:ssm:${aws:region}:${self:custom.awsAccountId}:parameter/fauxnance/${sls:stage}/upstreams/coingecko/api_key
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - IngestQueue
              - Arn
          batchSize: 1
          maximumConcurrency: 2
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    IngestDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-ingest-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    IngestQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-ingest
        VisibilityTimeout: 360
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - IngestDeadLetterQueue
              - Arn
          maxReceiveCount: 8

    IngestDeadLetterQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ingest-dlq-not-empty
        AlarmDescription: Ingest messages exhausted retries and reached the DLQ
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt:
                - IngestDeadLetterQueue
                - QueueName
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    OperationsDashboard:
      Type: AWS::CloudWatch::Dashboard
      Properties:
        DashboardName: ${self:service}-${sls:stage}-operations
        DashboardBody:
          Fn::Join:
            - ""
            - - '{"widgets":[{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"HTTP API traffic and errors","region":"${aws:region}","period":300,"view":"timeSeries","stacked":false,"metrics":[["AWS/ApiGateway","Count","ApiId","'
              - Ref: HttpApi
              - '","Stage","$default",{"stat":"Sum","label":"Count"}],[".","4xx",".",".",".",".",{"stat":"Sum","label":"4xx"}],[".","5xx",".",".",".",".",{"stat":"Sum","label":"5xx"}]]}},{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"HTTP API p95 latency","region":"${aws:region}","period":300,"view":"timeSeries","metrics":[["AWS/ApiGateway","Latency","ApiId","'
              - Ref: HttpApi
              - '","Stage","$default",{"stat":"p95","label":"Latency p95"}],[".","IntegrationLatency",".",".",".",".",{"stat":"p95","label":"Integration latency p95"}]]}},{"type":"metric","x":0,"y":6,"width":24,"height":8,"properties":{"title":"Lambda invocations, errors, and throttles","region":"${aws:region}","period":300,"view":"timeSeries","metrics":[["AWS/Lambda","Invocations","FunctionName","'
              - Ref: ApiLambdaFunction
              - '",{"stat":"Sum","label":"api invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"api errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"api throttles"}],["AWS/Lambda","Invocations","FunctionName","'
              - Ref: AdminLambdaFunction
              - '",{"stat":"Sum","label":"admin invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"admin errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"admin throttles"}],["AWS/Lambda","Invocations","FunctionName","'
              - Ref: AuthorizerLambdaFunction
              - '",{"stat":"Sum","label":"authorizer invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"authorizer errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"authorizer throttles"}],["AWS/Lambda","Invocations","FunctionName","'
              - Ref: DispatcherLambdaFunction
              - '",{"stat":"Sum","label":"dispatcher invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"dispatcher errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"dispatcher throttles"}],["AWS/Lambda","Invocations","FunctionName","'
              - Ref: BackfillCoordinatorLambdaFunction
              - '",{"stat":"Sum","label":"backfillCoordinator invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"backfillCoordinator errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"backfillCoordinator throttles"}],["AWS/Lambda","Invocations","FunctionName","'
              - Ref: IngestWorkerLambdaFunction
              - '",{"stat":"Sum","label":"ingestWorker invocations"}],[".","Errors",".",".",{"stat":"Sum","label":"ingestWorker errors"}],[".","Throttles",".",".",{"stat":"Sum","label":"ingestWorker throttles"}]]}},{"type":"metric","x":0,"y":14,"width":24,"height":7,"properties":{"title":"Lambda p95 duration","region":"${aws:region}","period":300,"view":"timeSeries","metrics":[["AWS/Lambda","Duration","FunctionName","'
              - Ref: ApiLambdaFunction
              - '",{"stat":"p95","label":"api"}],["AWS/Lambda","Duration","FunctionName","'
              - Ref: AdminLambdaFunction
              - '",{"stat":"p95","label":"admin"}],["AWS/Lambda","Duration","FunctionName","'
              - Ref: AuthorizerLambdaFunction
              - '",{"stat":"p95","label":"authorizer"}],["AWS/Lambda","Duration","FunctionName","'
              - Ref: DispatcherLambdaFunction
              - '",{"stat":"p95","label":"dispatcher"}],["AWS/Lambda","Duration","FunctionName","'
              - Ref: BackfillCoordinatorLambdaFunction
              - '",{"stat":"p95","label":"backfillCoordinator"}],["AWS/Lambda","Duration","FunctionName","'
              - Ref: IngestWorkerLambdaFunction
              - '",{"stat":"p95","label":"ingestWorker"}]]}},{"type":"metric","x":0,"y":21,"width":12,"height":7,"properties":{"title":"Ingest queues","region":"${aws:region}","period":300,"view":"timeSeries","metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","'
              - Fn::GetAtt:
                  - IngestQueue
                  - QueueName
              - '",{"stat":"Maximum","label":"ingest visible"}],[".","ApproximateNumberOfMessagesNotVisible",".",".",{"stat":"Maximum","label":"ingest in-flight"}],[".","ApproximateAgeOfOldestMessage",".",".",{"stat":"Maximum","label":"ingest oldest age"}],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","'
              - Fn::GetAtt:
                  - IngestDeadLetterQueue
                  - QueueName
              - '",{"stat":"Maximum","label":"DLQ visible"}]]}},{"type":"metric","x":12,"y":21,"width":12,"height":7,"properties":{"title":"DynamoDB capacity and throttles","region":"${aws:region}","period":300,"view":"timeSeries","metrics":[["AWS/DynamoDB","ConsumedReadCapacityUnits","TableName","${self:custom.dataTableName}",{"stat":"Sum","label":"data read"}],[".","ConsumedWriteCapacityUnits",".",".",{"stat":"Sum","label":"data write"}],[".","ReadThrottleEvents",".",".",{"stat":"Sum","label":"data read throttles"}],[".","WriteThrottleEvents",".",".",{"stat":"Sum","label":"data write throttles"}],["AWS/DynamoDB","ConsumedReadCapacityUnits","TableName","${self:custom.controlTableName}",{"stat":"Sum","label":"control read"}],[".","ConsumedWriteCapacityUnits",".",".",{"stat":"Sum","label":"control write"}],[".","ReadThrottleEvents",".",".",{"stat":"Sum","label":"control read throttles"}],[".","WriteThrottleEvents",".",".",{"stat":"Sum","label":"control write throttles"}]]}}]}'

    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-5xx
        AlarmDescription: HTTP API returned one or more server errors in five minutes
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value:
              Ref: HttpApi
          - Name: Stage
            Value: $default
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    AuthorizerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-authorizer-errors
        AlarmDescription: Authorizer Lambda failed instead of returning an authorization decision
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: AuthorizerLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    DispatcherErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-dispatcher-errors
        AlarmDescription: Scheduled market dispatcher failed
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: DispatcherLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    BackfillCoordinatorErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-backfill-coordinator-errors
        AlarmDescription: Administrative backfill coordinator failed
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: BackfillCoordinatorLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        DatapointsToAlarm: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    IngestQueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ingest-queue-age
        AlarmDescription: Oldest ingest message exceeded thirty minutes for ten minutes
        Namespace: AWS/SQS
        MetricName: ApproximateAgeOfOldestMessage
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt:
                - IngestQueue
                - QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 2
        DatapointsToAlarm: 2
        Threshold: 1800
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          DetailedMetricsEnabled: false
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 25
